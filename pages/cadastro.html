<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulário de Cadastro</title>
  <link rel="stylesheet" href="../css/formulario.css">
</head>
<body>
  <form>
    <h1 class="titulo">Formulário de Cadastro</h1>

    <div>
      <label>Tipo de cadastro</label>
      <div class="opcoes">
        <label class="opcao"><input type="radio" name="tipo" value="cpf" checked> CPF (pessoa física)</label>
        <label class="opcao"><input type="radio" name="tipo" value="cnpj"> CNPJ (empresa)</label>
      </div>
    </div>

    <div>
      <label id="rotulo-documento">CPF:</label>
      <input type="text" id="documento" maxlength="14" placeholder="000.000.000-00">
      <span id="erro-documento"></span>
    </div>

    <div>
      <label id="rotulo-nome">Nome completo:</label>
      <input type="text" id="nome">
      <span id="erro-nome"></span>
    </div>

    <div>
      <label>E-mail:</label>
      <input type="text" id="email">
      <span id="erro-email"></span>
    </div>

    <div>
      <label>CEP:</label>
      <input type="text" id="cep">
      <span id="erro-cep"></span>
    </div>

    <div>
      <label>Rua:</label>
      <input type="text" id="rua">
      <span id="erro-rua"></span>
    </div>

    <div>
      <label>Número:</label>
      <input type="text" id="numero">
      <span id="erro-numero"></span>
    </div>

    <div>
      <label>Complemento: (se não tiver, escreva: nenhum)</label>
      <input type="text" id="complemento">
      <span id="erro-complemento"></span>
    </div>

    <div>
      <label>Bairro:</label>
      <input type="text" id="bairro">
      <span id="erro-bairro"></span>
    </div>

    <div>
      <label>Cidade:</label>
      <input type="text" id="cidade">
      <span id="erro-cidade"></span>
    </div>

    <div>
      <label>Estado: (exemplo: SP)</label>
      <input type="text" id="estado" maxlength="2">
      <span id="erro-estado"></span>
    </div>

    <div>
      <label>Produto oferecido:</label>
      <textarea id="produto" rows="4" placeholder="Descreva o produto que está sendo oferecido"></textarea>
      <span id="erro-produto"></span>
    </div>

    <button type="button" onclick="validar()">Cadastrar</button>
    <p id="resultado"></p>
  </form>

  <script src="../js/formulario.js"></script>
</body>
</html>
